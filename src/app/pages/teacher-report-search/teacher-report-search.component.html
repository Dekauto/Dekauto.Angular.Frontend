@if (!(loading$ | async)) {
<form class="search-form" (ngSubmit)="submit()">
  <div class="grid">
    <div>
      <label>Учебный год</label>
      <div class="field-select">
        <select [(ngModel)]="filters.academicYear" name="academicYear">
          @for (year of years; track year) {
          <option [value]="year">{{ year }}</option>
          }
        </select>
      </div>
    </div>
    <div>
      <label>Семестр</label>
      <div class="field-select">
        <select [(ngModel)]="filters.semester" name="semester" (ngModelChange)="onSemesterChange()">
          @for (semester of semesters; track semester) {
          <option [value]="semester">{{ semester }}</option>
          }
        </select>
      </div>
    </div>
    <div>
      <label>Учебная группа</label>
      <div class="field-select">
        <select [(ngModel)]="filters.group" name="group" (ngModelChange)="onGroupChange()">
          @for (group of groups; track group) {
          <option [value]="group">{{ group }}</option>
          }
        </select>
      </div>
    </div>
  </div>
  <div class="subject-row">
    <label>Название предмета</label>
    <div class="field-select">
      <select [(ngModel)]="filters.subject" name="subject">
        @for (subject of subjects; track subject) {
        <option [value]="subject">{{ subject }}</option>
        }
      </select>
    </div>
  </div>
  <div class="submit-row">
    <button class="submit-btn" type="submit">Показать отчет по группе</button>
  </div>
</form>
}
